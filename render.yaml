services:
  - type: web
    name: arogya-rural-web-shwet0007
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://arogya-rural-api-shwet0007.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: arogya-rural-api-shwet0007
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend-springboot/Dockerfile
    dockerContext: ./backend-springboot
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: arogya-rural-db-shwet0007
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: arogya-rural-db-shwet0007
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: arogya-rural-db-shwet0007
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://arogya-rural-web-shwet0007.onrender.com
      - key: LOCATIONS_IMPORT_CSV
        value: data/render-demo-locations.csv
      - key: AI_SERVICE_BASE_URL
        value: https://arogya-rural-ai-shwet0007.onrender.com
      - key: AI_SERVICE_CONNECT_TIMEOUT
        value: 30s
      - key: AI_SERVICE_READ_TIMEOUT
        value: 60s

  - type: web
    name: arogya-rural-ai-shwet0007
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: 30
      - key: RAG_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RAG_TOP_K
        value: 4
      - key: VOICE_MODEL
        value: base
      - key: VOICE_DEVICE
        value: cpu
      - key: VOICE_COMPUTE_TYPE
        value: int8

databases:
  - name: arogya-rural-db-shwet0007
    plan: free
    region: singapore
    databaseName: arogya_rural
    user: arogya_rural
    ipAllowList: []
