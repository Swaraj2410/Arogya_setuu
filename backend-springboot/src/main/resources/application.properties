spring.application.name=arogya-rural-backend
server.port=${SERVER_PORT:5001}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:arogya_rural}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:change-this-development-secret-before-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

app.locations.import-csv=${LOCATIONS_IMPORT_CSV:}
app.locations.force-import=${LOCATIONS_FORCE_IMPORT:false}
